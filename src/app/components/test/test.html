<!-- 
have 2 inputBoxes, and a dropdown(+,-,*,/) and perform arithmetic operations -->

<div>
<input type="number" [(ngModel)] = "num1">

<select [(ngModel)]="operator">
    <option value="+"> + </option>
    <option value="-"> - </option>
    <option value="*">* </option>
    <option value="/"> / </option>
</select>

<input type="number" [(ngModel)]="num2">

<button class="btn btn-primary" (click)="calculate()"> calculate </button>
<p>result : {{result}}</p>

</div>
